<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Segoe UI',sans-serif">
  <defs>
    <linearGradient id="bg8" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6fbf8"/><stop offset="1" stop-color="#e9f4ee"/>
    </linearGradient>
    <filter id="sh8" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0b3d20" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="960" height="430" rx="18" fill="url(#bg8)"/>
  <text x="480" y="44" text-anchor="middle" font-size="23" font-weight="700" fill="#12331f">upstream 负载均衡策略对比</text>
  <text x="480" y="72" text-anchor="middle" font-size="14" fill="#4a6b57">在 upstream 块中声明，配合 proxy_pass http://backend 使用</text>

  <rect x="30" y="94" width="435" height="156" rx="14" fill="#ffffff" stroke="#cfe3d6" filter="url(#sh8)"/>
  <text x="52" y="124" font-size="15" font-weight="700" fill="#1f6b41">轮询（默认）</text>
  <rect x="52" y="136" width="180" height="28" rx="7" fill="#eef6f0" stroke="#cfe3d6"/>
  <text x="62" y="155" font-size="12.5" font-family="Consolas,Monaco,monospace" fill="#2c5a41">无需配置</text>
  <rect x="52" y="176" width="118" height="32" rx="8" fill="#eef6f0" stroke="#cfe3d6"/>
  <text x="111" y="197" text-anchor="middle" font-size="12.5" fill="#2c5a41">A 1/3</text>
  <rect x="182" y="176" width="118" height="32" rx="8" fill="#eef6f0" stroke="#cfe3d6"/>
  <text x="241" y="197" text-anchor="middle" font-size="12.5" fill="#2c5a41">B 1/3</text>
  <rect x="312" y="176" width="118" height="32" rx="8" fill="#eef6f0" stroke="#cfe3d6"/>
  <text x="371" y="197" text-anchor="middle" font-size="12.5" fill="#2c5a41">C 1/3</text>
  <text x="52" y="234" font-size="12.5" fill="#5c7d6a">请求依次分发：A → B → C → A ……</text>

  <rect x="495" y="94" width="435" height="156" rx="14" fill="#ffffff" stroke="#cfe3d6" filter="url(#sh8)"/>
  <text x="517" y="124" font-size="15" font-weight="700" fill="#1f6b41">加权轮询</text>
  <rect x="517" y="136" width="200" height="28" rx="7" fill="#eef6f0" stroke="#cfe3d6"/>
  <text x="527" y="155" font-size="12.5" font-family="Consolas,Monaco,monospace" fill="#2c5a41">server A weight=3</text>
  <rect x="517" y="176" width="118" height="32" rx="8" fill="#cdeada" stroke="#9fc9b2"/>
  <text x="576" y="197" text-anchor="middle" font-size="12.5" fill="#1f6b41">A 权重 3</text>
  <rect x="647" y="176" width="118" height="32" rx="8" fill="#eef6f0" stroke="#cfe3d6"/>
  <text x="706" y="197" text-anchor="middle" font-size="12.5" fill="#2c5a41">B 权重 1</text>
  <rect x="777" y="176" width="118" height="32" rx="8" fill="#eef6f0" stroke="#cfe3d6"/>
  <text x="836" y="197" text-anchor="middle" font-size="12.5" fill="#2c5a41">C 权重 1</text>
  <text x="517" y="234" font-size="12.5" fill="#5c7d6a">权重越高分到的请求越多，适合机器配置不均</text>

  <rect x="30" y="262" width="435" height="152" rx="14" fill="#ffffff" stroke="#cfe3d6" filter="url(#sh8)"/>
  <text x="52" y="292" font-size="15" font-weight="700" fill="#1f6b41">IP 哈希</text>
  <rect x="52" y="304" width="180" height="28" rx="7" fill="#eef6f0" stroke="#cfe3d6"/>
  <text x="62" y="323" font-size="12.5" font-family="Consolas,Monaco,monospace" fill="#2c5a41">ip_hash;</text>
  <rect x="52" y="344" width="378" height="32" rx="8" fill="#fff4e6" stroke="#e6c79a"/>
  <text x="241" y="365" text-anchor="middle" font-size="12.5" fill="#8a5a12">同一客户端 IP 始终落到同一后端</text>
  <text x="52" y="400" font-size="12.5" fill="#5c7d6a">解决会话保持（Session）问题，避免登录态丢失</text>

  <rect x="495" y="262" width="435" height="152" rx="14" fill="#ffffff" stroke="#cfe3d6" filter="url(#sh8)"/>
  <text x="517" y="292" font-size="15" font-weight="700" fill="#1f6b41">最少连接</text>
  <rect x="517" y="304" width="180" height="28" rx="7" fill="#eef6f0" stroke="#cfe3d6"/>
  <text x="527" y="323" font-size="12.5" font-family="Consolas,Monaco,monospace" fill="#2c5a41">least_conn;</text>
  <rect x="517" y="344" width="378" height="32" rx="8" fill="#eef6f0" stroke="#cfe3d6"/>
  <text x="706" y="365" text-anchor="middle" font-size="12.5" fill="#2c5a41">优先分发给当前连接数最少的后端</text>
  <text x="517" y="400" font-size="12.5" fill="#5c7d6a">适合长连接、请求耗时差异大的场景</text>
</svg>
