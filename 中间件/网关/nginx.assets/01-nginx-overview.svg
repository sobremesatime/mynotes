<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Segoe UI',sans-serif">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6fbf8"/><stop offset="1" stop-color="#e9f4ee"/>
    </linearGradient>
    <linearGradient id="ng1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00a94f"/><stop offset="1" stop-color="#00753b"/>
    </linearGradient>
    <filter id="sh1" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0b3d20" flood-opacity="0.20"/>
    </filter>
    <marker id="ar1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4b7a63"/>
    </marker>
  </defs>
  <rect width="960" height="470" rx="18" fill="url(#bg1)"/>
  <text x="480" y="44" text-anchor="middle" font-size="23" font-weight="700" fill="#12331f">Nginx 核心定位：高性能、模块化网关</text>
  <text x="480" y="72" text-anchor="middle" font-size="14" fill="#4a6b57">统一入口 · HTTP 静态服务 · 反向代理 · 负载均衡 · 单机支撑 5 万 QPS</text>

  <rect x="34" y="150" width="158" height="210" rx="14" fill="#ffffff" stroke="#cfe3d6" filter="url(#sh1)"/>
  <text x="113" y="180" text-anchor="middle" font-size="15" font-weight="700" fill="#2c5a41">客户端</text>
  <rect x="52" y="196" width="122" height="40" rx="9" fill="#eef6f0" stroke="#cfe3d6"/>
  <text x="113" y="221" text-anchor="middle" font-size="14" fill="#2c5a41">浏览器</text>
  <rect x="52" y="246" width="122" height="40" rx="9" fill="#eef6f0" stroke="#cfe3d6"/>
  <text x="113" y="271" text-anchor="middle" font-size="14" fill="#2c5a41">移动 App</text>
  <rect x="52" y="296" width="122" height="40" rx="9" fill="#eef6f0" stroke="#cfe3d6"/>
  <text x="113" y="321" text-anchor="middle" font-size="14" fill="#2c5a41">小程序</text>

  <line x1="196" y1="255" x2="284" y2="255" stroke="#4b7a63" stroke-width="2.5" marker-end="url(#ar1)"/>
  <text x="240" y="243" text-anchor="middle" font-size="12" fill="#4b7a63">HTTP 请求</text>

  <rect x="292" y="120" width="286" height="270" rx="16" fill="url(#ng1)" filter="url(#sh1)"/>
  <text x="435" y="156" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">Nginx 网关</text>
  <text x="435" y="178" text-anchor="middle" font-size="12" fill="#d7f0e0">单一域名 / 单一入口</text>
  <rect x="316" y="196" width="238" height="38" rx="9" fill="#ffffff" fill-opacity="0.93"/>
  <text x="435" y="221" text-anchor="middle" font-size="14" fill="#1f6b41">HTTP 静态服务</text>
  <rect x="316" y="242" width="238" height="38" rx="9" fill="#ffffff" fill-opacity="0.93"/>
  <text x="435" y="267" text-anchor="middle" font-size="14" fill="#1f6b41">反向代理</text>
  <rect x="316" y="288" width="238" height="38" rx="9" fill="#ffffff" fill-opacity="0.93"/>
  <text x="435" y="313" text-anchor="middle" font-size="14" fill="#1f6b41">负载均衡</text>
  <rect x="316" y="334" width="238" height="38" rx="9" fill="#ffffff" fill-opacity="0.93"/>
  <text x="435" y="359" text-anchor="middle" font-size="14" fill="#1f6b41">模块化扩展（多协议）</text>

  <path d="M578,178 C642,178 664,172 710,172" fill="none" stroke="#4b7a63" stroke-width="2.5" marker-end="url(#ar1)"/>
  <path d="M578,300 C642,300 664,322 710,322" fill="none" stroke="#4b7a63" stroke-width="2.5" marker-end="url(#ar1)"/>

  <rect x="716" y="130" width="210" height="86" rx="14" fill="#ffffff" stroke="#cfe3d6" filter="url(#sh1)"/>
  <text x="821" y="160" text-anchor="middle" font-size="15" font-weight="700" fill="#2c5a41">本地静态资源</text>
  <text x="821" y="186" text-anchor="middle" font-size="13" fill="#5c7d6a">HTML / CSS / JS / 图片</text>

  <rect x="716" y="240" width="210" height="150" rx="14" fill="#ffffff" stroke="#cfe3d6" filter="url(#sh1)"/>
  <text x="821" y="268" text-anchor="middle" font-size="15" font-weight="700" fill="#2c5a41">后端服务集群</text>
  <rect x="736" y="282" width="170" height="30" rx="8" fill="#eef6f0" stroke="#cfe3d6"/>
  <text x="821" y="302" text-anchor="middle" font-size="13" fill="#2c5a41">服务实例 A</text>
  <rect x="736" y="318" width="170" height="30" rx="8" fill="#eef6f0" stroke="#cfe3d6"/>
  <text x="821" y="338" text-anchor="middle" font-size="13" fill="#2c5a41">服务实例 B</text>
  <rect x="736" y="354" width="170" height="30" rx="8" fill="#eef6f0" stroke="#cfe3d6"/>
  <text x="821" y="374" text-anchor="middle" font-size="13" fill="#2c5a41">服务实例 C</text>
</svg>
