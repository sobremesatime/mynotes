<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Segoe UI',sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6fbf8"/><stop offset="1" stop-color="#e9f4ee"/>
    </linearGradient>
    <linearGradient id="ng3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00a94f"/><stop offset="1" stop-color="#00753b"/>
    </linearGradient>
    <filter id="sh3" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0b3d20" flood-opacity="0.18"/>
    </filter>
    <marker id="ar3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4b7a63"/>
    </marker>
  </defs>
  <rect width="960" height="470" rx="18" fill="url(#bg3)"/>
  <text x="480" y="44" text-anchor="middle" font-size="23" font-weight="700" fill="#12331f">反向代理与负载均衡</text>
  <text x="480" y="72" text-anchor="middle" font-size="14" fill="#4a6b57">对外只暴露单一入口，屏蔽后端真实 IP / 端口 / 部署架构，实现无感扩缩容</text>

  <rect x="40" y="170" width="164" height="130" rx="14" fill="#ffffff" stroke="#cfe3d6" filter="url(#sh3)"/>
  <text x="122" y="212" text-anchor="middle" font-size="15" font-weight="700" fill="#2c5a41">客户端</text>
  <text x="122" y="240" text-anchor="middle" font-size="12.5" fill="#5c7d6a">只认识一个域名</text>
  <text x="122" y="264" text-anchor="middle" font-size="12.5" fill="#5c7d6a">api.example.com</text>

  <line x1="206" y1="235" x2="292" y2="235" stroke="#4b7a63" stroke-width="2.5" marker-end="url(#ar3)"/>
  <text x="249" y="223" text-anchor="middle" font-size="12" fill="#4b7a63">统一请求</text>

  <rect x="298" y="120" width="230" height="230" rx="16" fill="url(#ng3)" filter="url(#sh3)"/>
  <text x="413" y="164" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">Nginx 统一入口</text>
  <text x="413" y="190" text-anchor="middle" font-size="12.5" fill="#d7f0e0">唯一对外暴露的地址</text>
  <rect x="320" y="210" width="186" height="36" rx="8" fill="#ffffff" fill-opacity="0.93"/>
  <text x="413" y="233" text-anchor="middle" font-size="13.5" fill="#1f6b41">接收全部前端请求</text>
  <rect x="320" y="254" width="186" height="36" rx="8" fill="#ffffff" fill-opacity="0.93"/>
  <text x="413" y="277" text-anchor="middle" font-size="13.5" fill="#1f6b41">按策略分发流量</text>
  <rect x="320" y="298" width="186" height="36" rx="8" fill="#ffffff" fill-opacity="0.93"/>
  <text x="413" y="321" text-anchor="middle" font-size="13.5" fill="#1f6b41">屏蔽后端真实信息</text>

  <path d="M530,200 C596,200 616,150 648,150" fill="none" stroke="#4b7a63" stroke-width="2.5" marker-end="url(#ar3)"/>
  <path d="M530,235 C596,235 616,235 648,235" fill="none" stroke="#4b7a63" stroke-width="2.5" marker-end="url(#ar3)"/>
  <path d="M530,270 C596,270 616,320 648,320" fill="none" stroke="#4b7a63" stroke-width="2.5" marker-end="url(#ar3)"/>

  <rect x="652" y="110" width="272" height="80" rx="13" fill="#ffffff" stroke="#cfe3d6" filter="url(#sh3)"/>
  <text x="788" y="144" text-anchor="middle" font-size="15" font-weight="700" fill="#2c5a41">后端服务实例 ①</text>
  <text x="788" y="170" text-anchor="middle" font-size="12.5" fill="#5c7d6a">192.168.1.10:8080</text>

  <rect x="652" y="196" width="272" height="80" rx="13" fill="#ffffff" stroke="#cfe3d6" filter="url(#sh3)"/>
  <text x="788" y="230" text-anchor="middle" font-size="15" font-weight="700" fill="#2c5a41">后端服务实例 ②</text>
  <text x="788" y="256" text-anchor="middle" font-size="12.5" fill="#5c7d6a">192.168.1.11:8080</text>

  <rect x="652" y="282" width="272" height="80" rx="13" fill="#ffffff" stroke="#cfe3d6" filter="url(#sh3)"/>
  <text x="788" y="316" text-anchor="middle" font-size="15" font-weight="700" fill="#2c5a41">后端服务实例 ③</text>
  <text x="788" y="342" text-anchor="middle" font-size="12.5" fill="#5c7d6a">192.168.1.12:8080</text>

  <text x="480" y="392" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2c5a41">业务扩容 / 缩容时，前端访问方式不变 → 系统可用性与扩展性大幅提升</text>
</svg>
