<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Segoe UI',sans-serif">
  <defs>
    <linearGradient id="bg6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6fbf8"/><stop offset="1" stop-color="#e9f4ee"/>
    </linearGradient>
    <linearGradient id="ng6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00a94f"/><stop offset="1" stop-color="#00753b"/>
    </linearGradient>
    <filter id="sh6" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0b3d20" flood-opacity="0.18"/>
    </filter>
    <marker id="ar6" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4b7a63"/>
    </marker>
    <marker id="ar6o" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#c2761c"/>
    </marker>
  </defs>
  <rect width="960" height="470" rx="18" fill="url(#bg6)"/>
  <text x="480" y="44" text-anchor="middle" font-size="23" font-weight="700" fill="#12331f">共享内存与磁盘缓存：数据一致 + 空间换时间</text>
  <text x="480" y="72" text-anchor="middle" font-size="14" fill="#4a6b57">多进程共用全局数据保障一致；磁盘暂存后端响应降低耗时与后端压力</text>

  <rect x="30" y="96" width="440" height="344" rx="16" fill="#ffffff" stroke="#cfe3d6" filter="url(#sh6)"/>
  <text x="250" y="130" text-anchor="middle" font-size="16" font-weight="700" fill="#1f6b41">① 共享内存机制</text>
  <text x="250" y="154" text-anchor="middle" font-size="12.5" fill="#5c7d6a">解决多进程全局数据分散、统计失真</text>

  <rect x="52" y="176" width="118" height="44" rx="9" fill="#eef6f0" stroke="#cfe3d6"/>
  <text x="111" y="203" text-anchor="middle" font-size="13" fill="#2c5a41">Worker 1</text>
  <rect x="191" y="176" width="118" height="44" rx="9" fill="#eef6f0" stroke="#cfe3d6"/>
  <text x="250" y="203" text-anchor="middle" font-size="13" fill="#2c5a41">Worker 2</text>
  <rect x="330" y="176" width="118" height="44" rx="9" fill="#eef6f0" stroke="#cfe3d6"/>
  <text x="389" y="203" text-anchor="middle" font-size="13" fill="#2c5a41">Worker 3</text>

  <line x1="111" y1="220" x2="200" y2="262" stroke="#4b7a63" stroke-width="2" marker-end="url(#ar6)"/>
  <line x1="250" y1="220" x2="250" y2="262" stroke="#4b7a63" stroke-width="2" marker-end="url(#ar6)"/>
  <line x1="389" y1="220" x2="300" y2="262" stroke="#4b7a63" stroke-width="2" marker-end="url(#ar6)"/>

  <rect x="70" y="266" width="360" height="92" rx="12" fill="url(#ng6)" filter="url(#sh6)"/>
  <text x="250" y="302" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">共享内存区（所有 Worker 共用）</text>
  <text x="250" y="330" text-anchor="middle" font-size="12.5" fill="#d7f0e0">限流计数 / 状态统计 → 数据全局一致</text>
  <text x="250" y="404" text-anchor="middle" font-size="12.5" fill="#5c7d6a">否则同一客户端的请求落到不同进程，计数会各算各的</text>

  <rect x="490" y="96" width="440" height="344" rx="16" fill="#ffffff" stroke="#cfe3d6" filter="url(#sh6)"/>
  <text x="710" y="130" text-anchor="middle" font-size="16" font-weight="700" fill="#1f6b41">② Proxy Cache 磁盘缓存</text>
  <text x="710" y="154" text-anchor="middle" font-size="12.5" fill="#5c7d6a">空间换时间：用磁盘暂存后端响应结果</text>

  <text x="510" y="192" font-size="12.5" font-weight="700" fill="#c2761c">首次请求</text>
  <rect x="510" y="202" width="118" height="42" rx="9" fill="#eef6f0" stroke="#cfe3d6"/>
  <text x="569" y="228" text-anchor="middle" font-size="12.5" fill="#2c5a41">Nginx</text>
  <rect x="652" y="202" width="118" height="42" rx="9" fill="#eef6f0" stroke="#cfe3d6"/>
  <text x="711" y="228" text-anchor="middle" font-size="12.5" fill="#2c5a41">后端服务</text>
  <rect x="794" y="202" width="118" height="42" rx="9" fill="#fff4e6" stroke="#e6c79a"/>
  <text x="853" y="228" text-anchor="middle" font-size="12.5" fill="#8a5a12">写入磁盘缓存</text>
  <line x1="628" y1="223" x2="648" y2="223" stroke="#4b7a63" stroke-width="2" marker-end="url(#ar6)"/>
  <line x1="770" y1="223" x2="790" y2="223" stroke="#c2761c" stroke-width="2" marker-end="url(#ar6o)"/>

  <text x="510" y="286" font-size="12.5" font-weight="700" fill="#1f6b41">重复请求</text>
  <rect x="510" y="296" width="118" height="42" rx="9" fill="#eef6f0" stroke="#cfe3d6"/>
  <text x="569" y="322" text-anchor="middle" font-size="12.5" fill="#2c5a41">Nginx</text>
  <rect x="652" y="296" width="118" height="42" rx="9" fill="#fff4e6" stroke="#e6c79a"/>
  <text x="711" y="322" text-anchor="middle" font-size="12.5" fill="#8a5a12">读取磁盘缓存</text>
  <rect x="794" y="296" width="118" height="42" rx="9" fill="#eef6f0" stroke="#cfe3d6"/>
  <text x="853" y="322" text-anchor="middle" font-size="12.5" fill="#2c5a41">直接返回前端</text>
  <line x1="628" y1="317" x2="648" y2="317" stroke="#4b7a63" stroke-width="2" marker-end="url(#ar6)"/>
  <line x1="770" y1="317" x2="790" y2="317" stroke="#4b7a63" stroke-width="2" marker-end="url(#ar6)"/>

  <text x="710" y="392" text-anchor="middle" font-size="12.5" fill="#5c7d6a">后端响应慢、重复请求多的场景下，提速效果最明显</text>
</svg>
