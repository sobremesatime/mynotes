<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Segoe UI',sans-serif">
  <defs>
    <linearGradient id="bg7" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6fbf8"/><stop offset="1" stop-color="#e9f4ee"/>
    </linearGradient>
    <filter id="sh7" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0b3d20" flood-opacity="0.16"/>
    </filter>
    <marker id="ar7" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4b7a63"/>
    </marker>
  </defs>
  <rect width="960" height="430" rx="18" fill="url(#bg7)"/>
  <text x="480" y="44" text-anchor="middle" font-size="23" font-weight="700" fill="#12331f">location 匹配优先级（由高到低）</text>
  <text x="480" y="72" text-anchor="middle" font-size="14" fill="#4a6b57">先按 listen 端口 → server_name 域名匹配 server，再按下列优先级匹配 location</text>

  <line x1="56" y1="108" x2="56" y2="366" stroke="#4b7a63" stroke-width="2.5" marker-end="url(#ar7)"/>
  <text x="56" y="98" text-anchor="middle" font-size="12" fill="#4b7a63">高</text>
  <text x="56" y="386" text-anchor="middle" font-size="12" fill="#4b7a63">低</text>

  <rect x="88" y="100" width="826" height="50" rx="11" fill="#0f7a41" filter="url(#sh7)"/>
  <text x="106" y="131" font-size="14" font-weight="700" fill="#ffffff">= 精确匹配</text>
  <text x="300" y="131" font-size="13.5" font-family="Consolas,Monaco,monospace" fill="#d7f0e0">location = /login {}</text>
  <text x="896" y="131" text-anchor="end" font-size="12.5" fill="#d7f0e0">命中即结束</text>

  <rect x="88" y="160" width="826" height="50" rx="11" fill="#149150" filter="url(#sh7)"/>
  <text x="106" y="191" font-size="14" font-weight="700" fill="#ffffff">^~ 前缀匹配</text>
  <text x="300" y="191" font-size="13.5" font-family="Consolas,Monaco,monospace" fill="#e6f7ec">location ^~ /static/ {}</text>
  <text x="896" y="191" text-anchor="end" font-size="12.5" fill="#e6f7ec">命中后不再查正则</text>

  <rect x="88" y="220" width="826" height="50" rx="11" fill="#3aa96a" filter="url(#sh7)"/>
  <text x="106" y="251" font-size="14" font-weight="700" fill="#ffffff">~ / ~* 正则匹配</text>
  <text x="300" y="251" font-size="13.5" font-family="Consolas,Monaco,monospace" fill="#ffffff">location ~ \.php$ {}</text>
  <text x="896" y="251" text-anchor="end" font-size="12.5" fill="#ffffff">按出现顺序，先命中先用</text>

  <rect x="88" y="280" width="826" height="50" rx="11" fill="#8cc9a6" filter="url(#sh7)"/>
  <text x="106" y="311" font-size="14" font-weight="700" fill="#12331f">普通前缀匹配</text>
  <text x="300" y="311" font-size="13.5" font-family="Consolas,Monaco,monospace" fill="#12331f">location /api/ {}</text>
  <text x="896" y="311" text-anchor="end" font-size="12.5" fill="#12331f">取最长匹配</text>

  <rect x="88" y="340" width="826" height="50" rx="11" fill="#d8ece0" filter="url(#sh7)"/>
  <text x="106" y="371" font-size="14" font-weight="700" fill="#12331f">/ 通用匹配</text>
  <text x="300" y="371" font-size="13.5" font-family="Consolas,Monaco,monospace" fill="#12331f">location / {}</text>
  <text x="896" y="371" text-anchor="end" font-size="12.5" fill="#4a6b57">兜底，最低优先级</text>
</svg>
